<div class="employee-container">
  <h2>Employee List</h2>

  <table class="employee-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Department</th>
        <th>Country</th>
        <th>Salary</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let e of employees">
        <td>{{ e.id }}</td>
        <td>{{ e.name }}</td>
        <td>{{ e.department }}</td>
        <td>{{ e.country }}</td>
        <td>{{ e.salary | currency:'USD' }}</td>
        <td>
          <!-- Delta adjustment -->
          <input type="number" [(ngModel)]="e.adjustment" placeholder="Adjust amount" class="adjust-input">
          <button class="update-btn" (click)="adjustSalary(e.id, e.adjustment)">Adjust</button>

          <!-- Absolute update -->
          <input type="number" [(ngModel)]="e.newSalary" placeholder="New salary" class="update-input">
          <button class="set-btn" (click)="updateSalary(e.id, e.newSalary)">Set Salary</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
